<html>
    <script src="https://requirejs.org/docs/release/2.3.5/minified/require.js"></script>
    <script src="http_queryipfs.js"></script>
    <script>
        this.q = new QueryIpfs();
        //var RETRIEVE_IPFS_URL = 'ws://localhost:7071/persist'
        //var RETRIEVE_IPFS_URL = 'ws://192.168.1.161:8080/ipfsproxy/persist'
        //var RETRIEVE_IPFS_URL = 'ws://192.168.1.161:8080/persist'
        //var RETRIEVE_IPFS_URL = 'http://35.236.42.205:80/persist'
        //var RETRIEVE_IPFS_URL = 'http://192.168.1.139:8080/ws/persist'
        //var RETRIEVE_IPFS_URL = 'http://192.168.1.139:8080/fs/persist' //causes cors exception
        //var RETRIEVE_IPFS_URL = 'ws://localhost:9090/ws/persist?append_header_host=api.dev.microfrmr.com'
        var RETRIEVE_IPFS_URL = 'http://localhost:9090/fs/persist'
        //var RETRIEVE_IPFS_URL = 'http://localhost:7071/persist'
        //var RETRIEVE_IPFS_URL = 'http://localhost:7073/api/v0/add?pin=true'

        function uploadCallback(event){
            console.log('uploadCallback called event', event);
            window.cid.innerHTML = event.data;
            console.log('uploadCallback resolved ');
        };

        var data = null;
        function uploadFile(e) {
            var parent = this;
            //console.log('upload e.target:', e);
            var file = e.target.files[0];

            var uploadBtn = document.getElementById("uploadBtn");
            console.log('upload window.uploadBtn.:', uploadBtn);
            if(file){
                parent.q.getAsByteArray(file).then((dat)=>{
                    uploadBtn.disabled=false;
                    parent.data = dat;
                });
            }else{
                 uploadBtn.disabled;
            }
        }

        // WS example
        function persistFile(event) {
            var parent = this;
            class Pobserver extends Observer {
                eventIsRelevant(e) {
                    console.log('eventIsRelevant = ',e);
                    if(e.type=='isReady'){
                        return true;
                    }else
                      return false;
                }

                reactToEvent(e) {
                    console.log('reactToEvent = ',e);
                    if(e.type=='isReady' && e.value==true){
                        //console.log('After timeout ready data= ', parent.data);
                        if(parent.data != null){
                            // make query call
                            parent.q.upload(parent.data, parent.uploadCallback);
                        }else{
                            console.warn('reactToEvent parent.data is null ');
                        }
                    }
                }
            };
            this.q.addObserver(new Pobserver());
            this.q.connect(RETRIEVE_IPFS_URL);
        }
    </script>
    <body>

            <label for="inputFile">Upload File
                <input id='inputFile' type="file" accept="image/*, video/*"  onchange="uploadFile(event)"/>
                <button id='uploadBtn' onclick="persistFile(event)" disabled>Upload</button>
                <button id='reset' type='reset'>Reset</button>
            </label>
            CID: <div id='cid'/>


    </body>

</html>
